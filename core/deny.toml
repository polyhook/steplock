# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Check for security vulnerabilities in dependencies
ignore = [
    # wee_alloc memory safety issue — upstream polyhook-core uses wee_alloc
    # for WASM; no safe upgrade exists. Filed against polyhook separately.
    { id = "RUSTSEC-2024-0436", reason = "transitive via polyhook-core (WASM allocator, not used in native builds)" },
    { id = "RUSTSEC-2022-0054", reason = "transitive via polyhook-core (WASM allocator, not used in native builds)" },
]

[licenses]
# Licenses explicitly allowed across all dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Platform/WASM support crates (transitive only)
    "MPL-2.0",
    "LGPL-2.1-or-later",
]

[bans]
# Deny multiple versions of the same crate.
# Skip this for now as there are expected duplicates (e.g. serde, thiserror).
multiple-versions = "warn"

[sources]
# Only allow crates from crates.io and GitHub.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
