[package]
name = "steplock-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Stateful quality gate logic for steplock"
license = "MIT"
repository = "https://github.com/polyhook/steplock"
homepage = "https://github.com/polyhook/steplock"
readme = "README.md"
keywords = ["ai", "hooks", "quality-gate", "polyhook", "checklist"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["Architecture.md", "deny.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"

# Clippy lints are ratcheted to `deny` incrementally — every PR promotes at
# least one more (see .steplock/checklists/pre-push).
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
manual_string_new = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
match_same_arms = "deny"
semicolon_if_nothing_returned = "deny"
if_not_else = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
needless_continue = "deny"
format_push_string = "deny"
missing_errors_doc = "deny"
must_use_candidate = "deny"
write_with_newline = "deny"
missing_const_for_fn = "deny"
needless_collect = "deny"
flat_map_option = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
redundant_else = "deny"
use_self = "deny"
ref_option_ref = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
from_iter_instead_of_collect = "deny"
doc_markdown = "deny"
str_to_string = "deny"
multiple_inherent_impl = "deny"
match_wildcard_for_single_variants = "deny"
manual_assert = "deny"
single_char_pattern = "deny"
explicit_iter_loop = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
string_slice = "deny"
shadow_unrelated = "deny"
assertions_on_result_states = "deny"
missing_panics_doc = "deny"
panic = "deny"
let_underscore_untyped = "deny"
needless_raw_string_hashes = "deny"
absolute_paths = "deny"
indexing_slicing = "deny"
exhaustive_structs = "deny"
exhaustive_enums = "deny"
unwrap_in_result = "deny"
missing_assert_message = "deny"
wildcard_imports = "deny"
wildcard_imports = "deny"

[dependencies]
cel-interpreter = "0.8"
chrono = { version = "0.4", features = ["serde"] }
polyhook = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "steplock"
path = "src/bin/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
proptest = "1"
tempfile = "3"
